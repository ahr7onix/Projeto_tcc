services:
  postgres:
    image: postgres:16-alpine
    container_name: tcc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tcc
      POSTGRES_USER: tcc
      POSTGRES_PASSWORD: tcc
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seeds.sql:/docker-entrypoint-initdb.d/02-seeds.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tcc -d tcc']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: tcc-api
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://tcc:tcc@postgres:5432/tcc
      JWT_SECRET: troque-isto-em-producao
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_TTL_DAYS: 30
      CORS_ORIGIN: '*'
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:

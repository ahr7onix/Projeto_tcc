# Publicação no Render — leia docs/PUBLICAR.md para o passo a passo.
#
# São três peças, todas no plano gratuito:
#   nutricare-adj-db      o banco de dados PostgreSQL
#   nutricare-adj-api     a API (NestJS)
#   nutricare-adj-painel  o painel web da nutricionista, site estático
#
# Os nomes viram o endereço do site e são únicos no mundo todo. "nutricare-api"
# e "nutricare-painel" já estão ocupados por outro projeto, por isso o "-adj".
#
# Não há nada para preencher à mão: o endereço do banco e os endereços dos dois
# serviços já estão amarrados aqui dentro. Basta o Render aplicar o arquivo.
#
# ATENÇÃO: o banco gratuito do Render expira em 30 dias. Antes disso é preciso
# trocar para o plano pago ou criar um banco novo. Para uso além da demonstração,
# vale migrar para um provedor com plano gratuito sem prazo (Neon, Supabase).

databases:
  - name: nutricare-adj-db
    plan: free
    region: oregon
    databaseName: nutricare
    user: nutricare

services:
  - type: web
    name: nutricare-adj-api
    runtime: node
    plan: free
    region: oregon
    rootDir: apps/api
    buildCommand: npm ci && npm run build
    # O preparar-banco.mjs cria as tabelas na primeira vez e não faz nada nas
    # seguintes, então pode ficar no start sem problema.
    startCommand: node preparar-banco.mjs && node dist/main.js
    healthCheckPath: /status
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Endereço do banco criado acima — preenchido pelo próprio Render.
      - key: DATABASE_URL
        fromDatabase:
          name: nutricare-adj-db
          property: connectionString
      # O banco do Render usa certificado próprio, por isso "no-verify".
      - key: DATABASE_SSL
        value: no-verify
      # Gerado pelo próprio Render, ninguém precisa saber o valor.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"
      # Endereço do painel, para o navegador liberar as chamadas.
      - key: CORS_ORIGIN
        value: https://nutricare-adj-painel.onrender.com
      # Mesmo Client ID do painel (ver docs/LOGIN_GOOGLE.md).
      - key: GOOGLE_CLIENT_ID
        value: 579066584754-mjlmqjmtscn5lgs7depm8uvovn92lm5d.apps.googleusercontent.com
      # "true" carrega pacientes fictícios para o cliente ter o que testar.
      # Troque para "false" antes de qualquer uso com paciente de verdade.
      - key: SEED_DEMO
        value: "true"

  - type: web
    name: nutricare-adj-painel
    runtime: static
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        value: https://nutricare-adj-api.onrender.com
      - key: VITE_GOOGLE_CLIENT_ID
        value: 579066584754-mjlmqjmtscn5lgs7depm8uvovn92lm5d.apps.googleusercontent.com
    # O painel é uma página só: qualquer endereço interno (/login, /pacientes)
    # tem que devolver o index.html, senão o servidor responde "404".
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
